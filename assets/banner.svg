<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Feishu + Telegram + Codex Bridge</title>
  <desc id="desc">A remote execution bridge with evidence-gated delivery, screenshots, and live API verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121932"/>
      <stop offset="1" stop-color="#1a2038"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="55" r="170" fill="#7dd3fc" opacity="0.08"/>
  <circle cx="1190" cy="280" r="150" fill="#f9a8d4" opacity="0.08"/>
  <path d="M0 250 C260 170 420 330 700 235 C930 158 1080 245 1280 180 L1280 320 L0 320 Z" fill="#ffffff" opacity="0.025"/>
  <g transform="translate(74 58)">
    <text x="0" y="0" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="5">CHUCHU BRIDGE</text>
    <text x="0" y="72" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">Feishu + Telegram + Codex</text>
    <text x="0" y="120" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Remote execution with evidence, screenshots, and live API checks.</text>
    <g transform="translate(0 166)" font-family="Segoe UI, Arial, sans-serif" font-size="17">
      <rect x="0" y="-24" width="164" height="42" rx="21" fill="#ffffff" opacity="0.06"/>
      <text x="20" y="3" fill="#e2e8f0">Unified channels</text>
      <rect x="184" y="-24" width="154" height="42" rx="21" fill="#ffffff" opacity="0.06"/>
      <text x="204" y="3" fill="#e2e8f0">Evidence gate</text>
      <rect x="358" y="-24" width="184" height="42" rx="21" fill="#ffffff" opacity="0.06"/>
      <text x="378" y="3" fill="#e2e8f0">Full-desktop PNG</text>
      <rect x="562" y="-24" width="196" height="42" rx="21" fill="#ffffff" opacity="0.06"/>
      <text x="582" y="3" fill="#e2e8f0">Live API probe</text>
    </g>
  </g>
  <g transform="translate(1000 159)" filter="url(#glow)">
    <circle cx="0" cy="0" r="56" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M-22 -8 L0 -26 L22 -8 L22 14 L0 30 L-22 14 Z" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-22 -8 L0 9 L22 -8 M0 9 L0 30" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
